<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quoridor · AI Studio</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="brand"><i></i> QUORIDOR <span>AI STUDIO</span></div><span class="local">LOCAL PLAYGROUND</span></header><section class="layout"><div class="arena"><div class="board-heading"><span id="status">당신의 차례</span><span>9 × 9 · CLASSIC</span></div><div id="board"></div><p class="instruction">점을 클릭해 이동 · 칸 사이에 커서를 대고 클릭해 벽 설치</p></div><aside><div class="intro"><span class="eyebrow">THINK AHEAD.</span><h1>한 수 너머를<br>바라보세요.</h1><p>직접 플레이하고, 다른 가능성을 탐색하세요.</p></div><div id="players"></div><section class="panel"><div class="panel-title">플레이 설정</div><label>모드<select id="mode"><option value="ai">AI 대전</option><option value="sandbox">양쪽 직접 조작</option></select></label><label>내 진영<select id="side"><option value="0">청록 · 선공</option><option value="1">분홍 · 후공</option></select></label><label>AI 생각 시간<select id="time"><option value="500">빠르게 · 0.5초</option><option value="2000">표준 · 2초</option><option value="5000" selected>깊게 · 5초</option><option value="15000">정밀 · 15초</option><option value="30000">최대 · 30초</option></select></label><div class="buttons"><button id="undo">↶ 무르기</button><button id="reset">새 게임</button></div></section><section class="panel"><div class="panel-title">포지션 분석 <span id="depth"></span></div><button id="hint" class="primary">✦ 최선 수 분석</button><div id="analysis" class="muted">현재 차례의 추천 수와 예상 진행을 확인하세요.</div></section><section class="panel"><div class="panel-title">기보 <span id="count">0 수</span></div><div id="history"></div><div class="buttons"><button id="save">저장</button><button id="load">불러오기</button><input id="file" type="file" accept=".json" hidden></div></section></aside></section><footer>QUORIDOR AI STUDIO <span>개인 연습과 시뮬레이션을 위한 공간</span></footer></main><script type="module" src="/src/app.js"></script></body></html>
