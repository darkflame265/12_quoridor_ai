name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v6

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 규칙·인식·브라우저 엔진 테스트
        run: npm test

      - name: 브라우저 AI 사이트 빌드
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: 배포 파일 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
